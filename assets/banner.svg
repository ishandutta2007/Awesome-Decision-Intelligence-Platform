<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Dynamic floating element animations */
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .floating-card1 { animation: float1 6s ease-in-out infinite; }
    .floating-card2 { animation: float2 7s ease-in-out infinite; }
    .pulse-bg { animation: pulse 4s ease-in-out infinite; }
    .animated-line { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  
  <!-- Glowing Background Orbs (Non-intrusive) -->
  <circle cx="200" cy="100" r="150" fill="#38bdf8" class="pulse-bg" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="180" fill="#c084fc" class="pulse-bg" opacity="0.15" filter="url(#glow)"/>

  <!-- Background Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200"/>
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400"/>
  </g>

  <!-- Background Dynamic Flow Lines (in backdrop behind text) -->
  <path d="M 100 320 Q 300 380 500 310 T 900 330 T 1100 280" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.4" class="animated-line"/>

  <!-- Visual Node Network (Right Side Decoration) -->
  <g class="floating-card2" opacity="0.85">
    <!-- Card Node 1 -->
    <rect x="820" y="70" width="220" height="70" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="850" cy="105" r="14" fill="#0284c7"/>
    <text x="850" y="110" font-family="sans-serif" font-size="12" fill="#fff" text-anchor="middle">⚡</text>
    <text x="875" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Automated Insights</text>
    <text x="875" y="118" font-family="sans-serif" font-size="11" fill="#94a3b8">Diagnostic Analytics</text>

    <!-- Card Node 2 -->
    <rect x="880" y="180" width="240" height="70" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="910" cy="215" r="14" fill="#6366f1"/>
    <text x="910" y="220" font-family="sans-serif" font-size="12" fill="#fff" text-anchor="middle">🧠</text>
    <text x="935" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Decision Engine</text>
    <text x="935" y="228" font-family="sans-serif" font-size="11" fill="#94a3b8">Typed Choice &amp; Scoring</text>

    <!-- Card Node 3 -->
    <rect x="800" y="280" width="230" height="70" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="830" cy="315" r="14" fill="#a855f7"/>
    <text x="830" y="320" font-family="sans-serif" font-size="12" fill="#fff" text-anchor="middle">🔄</text>
    <text x="855" y="310" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Smart Routing</text>
    <text x="855" y="328" font-family="sans-serif" font-size="11" fill="#94a3b8">Multi-Armed Bandits</text>
  </g>

  <!-- FOREGROUND CONTENT: Header & Title & Subtitle (Clear, readable, unaffected by dynamic shapes) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="130" y="21" class="badge-text" text-anchor="middle">🚀 DECISION INTELLIGENCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title">Awesome Decision Intelligence</text>
    
    <!-- Gradient Accent Sub-title / Highlight -->
    <text x="0" y="215" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="46px" fill="url(#accent)">Platforms &amp; Frameworks 💡</text>

    <!-- Subtitle Description -->
    <text x="0" y="265" class="subtitle">Automated Insight Discovery • Decision Automation • Contextual Analytics</text>
    <text x="0" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="15px" fill="#64748b">A curated ecosystem guide of SaaS platforms, open-source decision engines &amp; smart routers</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#accent)"/>
</svg>
